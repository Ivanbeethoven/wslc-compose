name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout wslc-rs path dependency
        shell: pwsh
        run: >
          git clone --depth 1 --branch master https://github.com/Ivanbeethoven/wslc-rs.git
          "$env:GITHUB_WORKSPACE\..\wslc-rs"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
