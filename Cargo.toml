[package]
name = "wslc-compose"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Docker Compose compatible orchestration for Microsoft WSL Containers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ivanbeethoven/wslc-compose"
homepage = "https://github.com/Ivanbeethoven/wslc-compose"
readme = "README.md"
exclude = ["wslcsdk.dll"]
keywords = ["wsl", "containers", "compose", "windows", "docker"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
compose_spec = "0.3"
dotenvy = "0.15"
indexmap = { version = "2.13", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
shlex = "1.3"
thiserror = "2.0"
wslc = "0.1.9"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = "thin"
strip = "symbols"
