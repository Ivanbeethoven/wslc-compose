name: healthcheck-demo

services:
  probe:
    image: ${WSLC_COMPOSE_IMAGE:-docker.io/library/alpine:latest}
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /etc/alpine-release"]
      interval: 2s
      timeout: 1s
      start_period: 1s
      retries: 3

  consumer:
    image: ${WSLC_COMPOSE_IMAGE:-docker.io/library/alpine:latest}
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      probe:
        condition: service_healthy
